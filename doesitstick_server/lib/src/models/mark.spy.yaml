### A parent's observation. Synced with Serverpod offline sync inside the
### family's space: a phone writes it locally, offline if need be, and the
### UUID id (made on the phone) keeps re-sends idempotent.
class: Mark
table: mark
database: sync
fields:
  questionId: int
  cardId: int
  familyId: int
  outcome: Outcome
  parentName: String
  authUserId: UuidValue?
  markedAt: DateTime
indexes:
  mark_question_idx:
    fields: questionId
  mark_card_idx:
    fields: cardId
